<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cyber Shield - Login</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 320px; text-align: center; border: 1px solid #334155; }
        h2 { margin-bottom: 20px; color: #38bdf8; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0369a1; }
        #msg { margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🛡️ Cyber Shield</h2>
        <input type="text" id="username" placeholder="Username / Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button onclick="handleLogin()">Login & Proceed to Scan</button>
        <p id="msg"></p>
    </div>

    <script>
        async function handleLogin() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            const msg = document.getElementById("msg");

            if (!user || !pass) {
                msg.style.color = "#f87171";
                msg.innerText = "Please fill all fields!";
                return;
            }

            try {
                const res = await fetch("http://127.0.0.1:8000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await res.json();
                if (res.ok) {
                    msg.style.color = "#4ade80";
                    msg.innerText = "Login Successful! Redirecting to Scanner...";
                    
                    // Token local storage me save karo
                    localStorage.setItem("user_authenticated", "true");
                    
                    // Direct index.html par bhej do
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 800);
                } else {
                    msg.style.color = "#f87171";
                    msg.innerText = data.detail || "Invalid Credentials!";
                }
            } catch (err) {
                msg.style.color = "#f87171";
                msg.innerText = "Cannot connect to server!";
            }
        }
    </script>
</body>
</html>
